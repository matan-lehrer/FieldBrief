services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldbrief
      POSTGRES_PASSWORD: fieldbrief
      POSTGRES_DB: fieldbrief
    ports:
      # 5433 on the host: 5432 is often already taken by a system-installed Postgres.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldbrief -d fieldbrief"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fieldbrief
      RABBITMQ_DEFAULT_PASS: fieldbrief
    ports:
      # 5673/15673 on the host: a system-installed rabbitmq-server often
      # already owns 5672/15672, the same class of conflict as Postgres/5432.
      - "5673:5672"   # AMQP
      - "15673:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - searxng_data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
  searxng_data:
