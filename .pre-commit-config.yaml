# Local hooks use the project's own tool versions (from uv.lock), so there's
# nothing to pin here and pre-commit always matches CI.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: no-env-file
        name: block committing .env
        entry: .env files must not be committed
        language: fail
        files: '(^|/)\.env$'
