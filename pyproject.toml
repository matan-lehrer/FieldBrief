[project]
name = "fieldbrief"
version = "0.1.0"
description = "AI-powered competitive analysis, built on real strategy frameworks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matan Lehrer" }]
requires-python = ">=3.12"
# Runtime dependencies are added per stage (uv add <pkg>) so the lockfile pins
# tested versions. Planned: fastapi, uvicorn[standard], pydantic, pydantic-settings,
# sqlalchemy[asyncio], asyncpg, alembic, langgraph, langgraph-checkpoint-postgres,
# litellm, faststream[rabbit], httpx, trafilatura, playwright, jinja2, typer, langfuse, structlog.
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.16",
    "litellm>=1.106.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
]

[project.scripts]
fieldbrief = "fieldbrief.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldbrief"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "RUF",
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# Typer's documented pattern requires `= typer.Option(...)`/`typer.Argument(...)`
# as the parameter default — not the B008 mutable-default footgun it normally catches.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"evals/**" = ["S"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fieldbrief"]
# Enable once pydantic is a dependency (Stage 1):
# plugins = ["pydantic.mypy"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: hits real external APIs or LLMs (skipped by default; run with -m live)",
]

[tool.coverage.run]
source = ["src/fieldbrief"]
branch = true
