# Minimal reverse proxy matching design.md §9's architecture — TLS/LB are
# out of scope for local dev (MVP runs on docker compose, not a real
# deployment yet); this exists so the documented shape is real, not aspirational.
#
# Not yet wired into docker-compose.yml: the API/worker run directly via
# `uv run` on the host for now (verified end to end that way), not as
# containers — there's no Dockerfile for them yet. This config is prepared
# ahead of that containerization (stage 8), not a dangling reference.
events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SSE: buffering off, no timeout cap (design.md: "streams SSE with
        # buffering off") — otherwise nginx holds the whole response until
        # the connection closes, defeating the point of a progress stream.
        location /reports/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
    }
}
